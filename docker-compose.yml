services:
  postgres:
    image: postgres:15-alpine
    container_name: kaksekam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaksekam
      POSTGRES_PASSWORD: kaksekam
      POSTGRES_DB: kaksekam
    ports:
      - "5432:5432"
    volumes:
      - kaksekam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaksekam -d kaksekam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kaksekam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kaksekam_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kaksekam_postgres_data:
  kaksekam_redis_data:
