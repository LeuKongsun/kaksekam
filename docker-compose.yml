services:
  backend:
    image: kongsun/kaksekam-backend:latest
    platform: linux/amd64
    container_name: kaksekam-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 9000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      STORE_CORS: ${STORE_CORS:?STORE_CORS is required}
      ADMIN_CORS: ${ADMIN_CORS:?ADMIN_CORS is required}
      AUTH_CORS: ${AUTH_CORS:?AUTH_CORS is required}
      DISABLE_MEDUSA_ADMIN: "true"
    ports:
      - "${BACKEND_PORT:-9000}:9000"

  postgres:
    image: postgres:15-alpine
    container_name: kaksekam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaksekam
      POSTGRES_PASSWORD: kaksekam
      POSTGRES_DB: kaksekam
    ports:
      - "5432:5432"
    volumes:
      - kaksekam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaksekam -d kaksekam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kaksekam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kaksekam_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kaksekam_postgres_data:
  kaksekam_redis_data:
